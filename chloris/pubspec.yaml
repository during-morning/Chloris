name: chloris
description: "Cholris — Legado-E 兼容的跨平台阅读与音乐播放器（Flutter）。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 规则引擎（纯 Dart，路径依赖）
  chloris_engine:
    path: ../packages/chloris_engine

  # 状态 / 路由
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0

  # 数据层
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42

  # 平台 & 通用
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  file_picker: ^11.0.3
  url_launcher: ^6.3.2
  video_player: ^2.11.1

  # 网络 / Web 服务
  http: ^1.6.0
  html: ^0.15.6
  crypto: ^3.0.7
  archive: ^4.1.0
  enough_convert: ^1.6.0
  pointycastle: ^4.0.0
  collection: ^1.19.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  web_socket_channel: ^3.0.3
  web: ^1.1.1
  xml: ^7.0.1

  flutter_js: ^0.8.7
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  audio_session: ^0.2.2
  audio_service: ^0.18.19
  audio_service_mpris: ^0.2.1
  path: ^1.9.1
  share_plus: ^12.0.2
  flutter_local_notifications: ^22.3.0
  mobile_scanner: ^7.4.0
  app_links: ^7.2.1
  flutter_tts: ^4.2.5
  lucide_icons_flutter: ^3.1.19
  wakelock_plus: ^1.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.31.0

flutter:
  uses-material-design: true
  assets:
    - assets/sources/default_book_sources.json
    - assets/sources/default_dict_rules.json
    - assets/sources/default_replace_rules.json
    - assets/sources/default_rss_sources.json
    - assets/sources/default_txt_toc_rules.json
    - assets/brand/icon.png
    - assets/illustrations/

  # Bundled so the Claude and terminal styles render their real typography
  # everywhere — including Flutter Web/CanvasKit, which keeps its own font
  # collection and cannot resolve platform fonts or DOM @font-face rules.
  # All four families are SIL Open Font License 1.1 (see assets/fonts/OFL.md).
  fonts:
    - family: PTSerif
      fonts:
        - asset: assets/fonts/PTSerif-Regular.ttf
        - asset: assets/fonts/PTSerif-Bold.ttf
          weight: 700
    - family: SourceSansPro
      fonts:
        - asset: assets/fonts/SourceSansPro-Regular.ttf
        - asset: assets/fonts/SourceSansPro-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    # Bundled CJK fallback. Noto Sans SC includes uncommon Han characters so
    # CanvasKit does not need a network font download; Noto Serif SC is a
    # smaller serif face and falls back to the sans face for missing glyphs.
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.otf
